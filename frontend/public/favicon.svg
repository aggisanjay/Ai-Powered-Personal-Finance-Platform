  <path d="M32 14 L46 48 L38.5 48 L35.2 39.5 L28.8 39.5 L25.5 48 L18 48 Z M32 23.5 L29.9 33.8 L34.1 33.8 Z" fill="#FFFFFF" filter="url(#shadow)" />

