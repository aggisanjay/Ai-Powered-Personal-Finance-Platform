  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#auraGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />

